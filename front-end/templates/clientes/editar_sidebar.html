{{define "clientes/editar_sidebar.html"}}
<link rel="stylesheet" href="/static/css/pages.css">
<form hx-post="/clientes/salvar" hx-target="body">
    <input type="hidden" name="id" value="{{.Cliente.ID}}">

    <div class="form-grid">
        <div class="form-group full">
            <label class="form-label">Nome completo *</label>
            <input type="text" name="nome" class="form-input" value="{{.Cliente.Nome}}" required placeholder="Nome do cliente">
        </div>

        <div class="form-group">
            <label class="form-label">CPF / CNPJ</label>
            <input type="text" name="cpf_cnpj" id="cpf_cnpj" class="form-input" value="{{.Cliente.CpfCnpj}}" placeholder="000.000.000-00" oninput="window.formatarDocumento(this)">
        </div>

        <div class="form-group">
            <label class="form-label">Telefone</label>
            <input type="text" name="telefone" id="telefone" class="form-input" value="{{.Cliente.Telefone}}" placeholder="(00) 00000-0000" oninput="window.formatarTelefone(this)">
        </div>

        <div class="form-group full">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-input" value="{{.Cliente.Email}}" placeholder="email@exemplo.com">
        </div>

        <div class="form-group full">
            <label class="form-label">Endereço</label>
            <input type="text" name="endereco" class="form-input" value="{{.Cliente.Endereco}}" placeholder="Rua, número, complemento">
        </div>

        <div class="form-group">
            <label class="form-label">Cidade</label>
            <input type="text" name="cidade" class="form-input" value="{{.Cliente.Cidade}}" placeholder="Cidade">
        </div>

        <div class="form-group">
            <label class="form-label">Estado</label>
            <select name="estado" class="form-select">
                <option value="">UF</option>
                {{range .Estados}}
                <option value="{{.}}" {{if eq . $.Cliente.Estado}}selected{{end}}>{{.}}</option>
                {{end}}
            </select>
        </div>

        <div class="form-group full">
            <label class="form-label">Observações</label>
            <textarea name="observacoes" class="form-textarea" placeholder="Informações adicionais sobre o cliente...">{{.Cliente.Observacoes}}</textarea>
        </div>
    </div>

    <div class="form-actions">
        <button type="button" class="btn-ghost" onclick="closeSidebar()">Cancelar</button>
        <button type="submit" class="btn-primary-agro">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Salvar
        </button>
    </div>
</form>
{{end}}
