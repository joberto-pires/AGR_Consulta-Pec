{{template "base.html" .}}
{{define "content"}}
<link rel="stylesheet" href="/static/css/pages.css">
<div class="container-fluid fade-in">
 
    <div class="page-header">
        <div>
            <h1 class="page-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Clientes
            </h1>
            <p class="page-subtitle">{{.TotalRegistros}} clientes cadastrados</p>
        </div>
        <button class="btn-primary-agro"
            hx-get="/clientes/novo" hx-target="#sidebar-body" hx-swap="innerHTML"
            onclick="document.getElementById('sidebar-title').textContent='Novo Cliente'; document.getElementById('modal-container').classList.add('show'); document.body.style.overflow='hidden'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Novo Cliente
        </button>
    </div>
 
    <div class="toolbar">
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" class="search-input" placeholder="Buscar por nome, CPF/CNPJ, email..."
                name="busca" value="{{.Busca}}"
                hx-get="/clientes?partial=1"
                hx-target="#tabela-clientes"
                hx-trigger="keyup changed delay:400ms"
                hx-include="[name='busca']">
        </div>
    </div>
 
    <div class="data-card" id="tabela-clientes">
        {{template "clientes/tabela.html" .}}
    </div>
</div>
{{end}}
