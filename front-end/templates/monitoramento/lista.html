{{template "base.html" .}}
{{define "content"}}
<link rel="stylesheet" href="/static/css/pages.css">
<div class="container-fluid fade-in">

    <div class="page-header">
        <div>
            <h1 class="page-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                Monitoramento
            </h1>
            <p class="page-subtitle">{{.TotalRegistros}} registros de monitoramento</p>
        </div>
        <button class="btn-primary-agro"
            hx-get="/monitoramento/novo" hx-target="#sidebar-body" hx-swap="innerHTML"
            onclick="document.getElementById('sidebar-title').textContent='Novo Registro'; document.getElementById('modal-container').classList.add('show'); document.body.style.overflow='hidden'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Novo Registro
        </button>
    </div>

    <div class="toolbar">
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" class="search-input" placeholder="Buscar por propriedade, cliente, tipo..."
                name="busca" value="{{.Busca}}"
                hx-get="/monitoramento?partial=1"
                hx-target="#tabela-monitoramento"
                hx-trigger="keyup changed delay:400ms"
                hx-include="[name='busca']">
        </div>
    </div>

    <div class="data-card" id="tabela-monitoramento">
        {{template "monitoramento/tabela.html" .}}
    </div>
</div>
{{end}}
